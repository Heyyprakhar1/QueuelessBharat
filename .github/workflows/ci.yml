name: CI & Release Engineering Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Static Validation: Fast linting, formatting & type checks
  # ============================================================================
  static-validation:
    name: Static Code & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv for Python tooling
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Backend - Ruff Lint Check
        run: |
          cd backend
          uv run ruff check .

      - name: Backend - Ruff Format Check
        run: |
          cd backend
          uv run ruff format --check .

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Frontend - Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend - Oxlint Check
        run: |
          cd frontend
          npm run lint

      - name: Frontend - TypeScript Validation
        run: |
          cd frontend
          npx tsc -b

      - name: Frontend - Production Asset Build Verification
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 2. Backend Automated Test Suite & Database Migration Validation
  # ============================================================================
  backend-tests:
    name: Backend Pytest & Alembic Verification
    runs-on: ubuntu-latest
    needs: static-validation
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: queless_test
          POSTGRES_USER: queless_user
          POSTGRES_PASSWORD: queless_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queless_user -d queless_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv for Python tooling
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Apply database migrations to head
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: queless_user
          POSTGRES_PASSWORD: queless_password
          POSTGRES_DB: queless_test
          ENVIRONMENT: development
          AUTH_SECRET_KEY: test-secret-key-at-least-32-characters-for-ci-tests!
        run: |
          cd backend
          uv run alembic upgrade head
          uv run alembic current

      - name: Run Pytest test suite with coverage
        env:
          TESTING: "true"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: queless_user
          POSTGRES_PASSWORD: queless_password
          POSTGRES_DB: queless_test
          ENVIRONMENT: development
          AUTH_SECRET_KEY: test-secret-key-at-least-32-characters-for-ci-tests!
        run: |
          cd backend
          uv run pytest --cov=app --cov-report=term-missing

  # ============================================================================
  # 3. Real Browser End-to-End Test Suite (Playwright)
  # ============================================================================
  browser-e2e-tests:
    name: Browser E2E Playwright Suite
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: queless_db
          POSTGRES_USER: queless_user
          POSTGRES_PASSWORD: queless_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queless_user -d queless_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv for Python tooling
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci

      - name: Install Playwright Chromium with system dependencies
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Prepare database schema and seed data
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: queless_user
          POSTGRES_PASSWORD: queless_password
          POSTGRES_DB: queless_db
          ENVIRONMENT: development
          AUTH_SECRET_KEY: test-secret-key-at-least-32-characters-for-ci-tests!
        run: |
          cd backend
          uv run alembic upgrade head
          PYTHONPATH=. uv run python scripts/seed_data.py

      - name: Start backend API service on port 8001
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: queless_user
          POSTGRES_PASSWORD: queless_password
          POSTGRES_DB: queless_db
          ENVIRONMENT: development
          PORT: 8001
          AUTH_SECRET_KEY: test-secret-key-at-least-32-characters-for-ci-tests!
          ALLOWED_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
        run: |
          cd backend
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 > backend.log 2>&1 &
          echo "Waiting for backend API readiness..."
          timeout 30 sh -c 'until curl -sf http://localhost:8001/api/v1/health; do sleep 1; done'

      - name: Start frontend web server on port 5173
        env:
          VITE_API_BASE_URL: http://localhost:8001
        run: |
          cd frontend
          nohup npm run dev -- --port 5173 --host 0.0.0.0 > frontend.log 2>&1 &
          echo "Waiting for frontend web server readiness..."
          timeout 30 sh -c 'until curl -sf http://localhost:5173/; do sleep 1; done'

      - name: Run Playwright Browser E2E test suite
        run: |
          cd frontend
          npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
            backend/backend.log
            frontend/frontend.log
          retention-days: 7

  # ============================================================================
  # 4. Container Build, Compose Validation & Security Scanning
  # ============================================================================
  docker-build-and-scan:
    name: Docker Build, Compose & Trivy Security Scan
    runs-on: ubuntu-latest
    needs: static-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose specification
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute deterministic image tags
        id: vars
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            queless-backend:${{ steps.vars.outputs.short_sha }}
            queless-backend:${{ steps.vars.outputs.commit_sha }}
            queless-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            queless-frontend:${{ steps.vars.outputs.short_sha }}
            queless-frontend:${{ steps.vars.outputs.commit_sha }}
            queless-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Backend Non-Root User Compliance
        run: |
          USER=$(docker run --rm queless-backend:${{ steps.vars.outputs.short_sha }} whoami)
          echo "Backend runs as: $USER"
          if [ "$USER" != "appuser" ]; then
            echo "Security violation: Backend container must run as non-root user appuser"
            exit 1
          fi

      - name: Verify Frontend Non-Root User Compliance
        run: |
          USER=$(docker run --rm queless-frontend:${{ steps.vars.outputs.short_sha }} whoami)
          echo "Frontend runs as: $USER"
          if [ "$USER" != "nginx" ]; then
            echo "Security violation: Frontend container must run as non-root user nginx"
            exit 1
          fi

      - name: Run Trivy Vulnerability Scanner on Backend Image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            queless-backend:${{ steps.vars.outputs.short_sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            queless-backend:${{ steps.vars.outputs.short_sha }}

      - name: Run Trivy Vulnerability Scanner on Frontend Image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            queless-frontend:${{ steps.vars.outputs.short_sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            queless-frontend:${{ steps.vars.outputs.short_sha }}
